name: Actualizar RSS El Correo de Andalucía

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Generar RSS
        run: |
          python elcorreoweb_rss.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feeds/elcorreoweb-sevilla.xml
          git add feeds/elcorreoweb-andalucia.xml

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar RSS El Correo de Andalucía"
            git push
          fi
